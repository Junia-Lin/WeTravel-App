<template v-for="(item, idx) in currentDay.items" :key="item.id || idx">
                            <div class="relative group">
                                <!-- Timeline Node Dot -->
                                <div
                                    class="absolute -left-[31px] top-6 w-4 h-4 rounded-full bg-white border-4 border-primary-400 group-hover:border-primary-500 transition-colors shadow-sm">
                                </div>

                                <!-- Item Card -->
                                <div
                                    class="bg-white rounded-3xl p-5 shadow-soft border border-stone-100 hover:shadow-md transition-shadow relative overflow-hidden">
                                    <div class="flex items-start justify-between gap-3 mb-2">
                                        <div class="flex items-center gap-2">
                                            <span
                                                class="text-xs font-extrabold text-primary-600 bg-primary-50 px-2.5 py-1 rounded-lg">
                                                {{ item.time || '--:--' }}
                                            </span>
                                            <h3 class="text-base font-bold text-stone-800">{{ item.location }}</h3>
                                        </div>

                                        <div class="flex items-center gap-1">
                                            <button @click="openItemModal(item, idx)"
                                                class="w-8 h-8 rounded-full flex items-center justify-center text-stone-400 hover:text-stone-700 hover:bg-stone-100 transition">
                                                <i class="ph-bold ph-pencil-simple text-base"></i>
                                            </button>
                                            <button @click="removeItem(idx)"
                                                class="w-8 h-8 rounded-full flex items-center justify-center text-stone-300 hover:text-red-500 hover:bg-red-50 transition">
                                                <i class="ph-bold ph-trash text-base"></i>
                                            </button>
                                            <div class="loc-drag-handle cursor-grab active:cursor-grabbing w-8 h-8 rounded-full flex items-center justify-center text-stone-300 hover:text-stone-500">
                                                <i class="ph-bold ph-dots-six-vertical text-lg"></i>
                                            </div>
                                        </div>
                                    </div>

                                    <p v-if="item.note" class="text-sm text-stone-500 leading-relaxed mb-3">
                                        {{ item.note }}
                                    </p>

                                    <div v-if="item.cost" class="flex items-center gap-1.5 text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-xl w-fit">
                                        <i class="ph-bold ph-currency-circle-dollar text-sm"></i>
                                        <span>{{ setup.currency }} {{ item.cost }}</span>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Add Item Button -->
                        <button @click="openItemModal(null)"
                            class="w-full py-4 border-2 border-dashed border-stone-200 rounded-3xl text-stone-400 hover:border-primary-300 hover:text-primary-500 hover:bg-white transition flex items-center justify-center gap-2 font-bold text-sm">
                            <i class="ph-bold ph-plus"></i>
                            <span>新增行程地點</span>
                        </button>
                    </div>
                </div>
            </transition>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bg-white border-t border-stone-100 px-6 py-2 pb-safe flex justify-around items-center z-20">
            <button @click="viewMode = 'plan'"
                class="flex flex-col items-center gap-1 py-1 px-4 rounded-2xl transition"
                :class="viewMode === 'plan' ? 'text-primary-500 font-bold' : 'text-stone-400'">
                <i class="ph-bold ph-calendar-blank text-2xl"></i>
                <span class="text-xs">行程</span>
            </button>
            <button @click="viewMode = 'wallet'"
                class="flex flex-col items-center gap-1 py-1 px-4 rounded-2xl transition"
                :class="viewMode === 'wallet' ? 'text-primary-500 font-bold' : 'text-stone-400'">
                <i class="ph-bold ph-wallet text-2xl"></i>
                <span class="text-xs">記帳</span>
            </button>
            <button @click="viewMode = 'prep'"
                class="flex flex-col items-center gap-1 py-1 px-4 rounded-2xl transition"
                :class="viewMode === 'prep' ? 'text-primary-500 font-bold' : 'text-stone-400'">
                <i class="ph-bold ph-check-square text-2xl"></i>
                <span class="text-xs">準備</span>
            </button>
        </nav>
    </div>
</body>
</html>
